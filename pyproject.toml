[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proyecto-lgbti"
version = "1.0.0"
description = "RainbowLens Datahub LGBTIQ+ data analysis and visualization platform"
requires-python = ">=3.14,<3.15"
dependencies = [
    "dash==4.4.0",
    "dash-ag-grid==35.3.0",
    "plotly==6.9.0",
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn==0.51.0",
    "Flask==3.1.3",
    "Flask-Login==0.6.3",
    "python-dotenv==1.2.2",
    "gunicorn==26.0.0",
    "psycopg[binary]==3.3.4",
    "psycopg_pool==3.3.1",
    "pymongo==4.17.0",
    "pydantic==2.13.4",
    "email-validator==2.3.0",
    "pandas==3.0.3",
    "numpy==2.4.6",
    "geopandas==1.1.4",
    "PyMuPDF==1.28.0",
    "Pillow==12.3.0",
    "kaleido==1.3.0",
    "choreographer==1.3.0",
    "reportlab==4.5.1",
    "boto3==1.43.51",
    "botocore==1.43.51",
    "bleach==6.4.0",
]

[project.optional-dependencies]
dev = [
    "bandit==1.9.4",
    "coverage==7.15.4",
    "httpx2==2.10.0",
    "pip-audit==2.10.0",
    "pyright==1.1.411",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.0",
    "vulture==2.16",
]

[project.scripts]
rainbowlens-dash = "app.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"app.web" = ["assets/**/*.css", "assets/**/*.js", "assets/img/*"]
"app.shared.data" = ["resources/*.geojson"]
"app.modules.didactics" = ["data/*.json"]
"app.modules.home" = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider", "-p", "no:dash"]
markers = [
    "browser: requires a locally executable Chrome/Chromium and Kaleido",
    "production_like: opt-in smoke coverage for CI or the Render runtime",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 73
precision = 1
show_missing = true
skip_empty = true

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["tmp"]

[tool.ruff.lint]
select = [
    "B",
    "BLE",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "FLY",
    "FURB",
    "I",
    "ISC",
    "PIE",
    "PLR0124",
    "PLR0402",
    "PYI",
    "RUF",
    "SIM",
    "TRY004",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
# These files intentionally contain mojibake sequences to repair and test imported data.
"src/app/modules/statistics/exports.py" = ["RUF001"]
"tests/unit/analytics/test_statistics.py" = ["RUF001"]

[tool.ruff.format]
line-ending = "lf"
