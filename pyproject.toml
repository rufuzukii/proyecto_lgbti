[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proyecto-lgbti"
version = "0.1.0"
description = "RainbowLens Datahub LGBTIQ+ data analysis and visualization platform"
requires-python = ">=3.14,<3.15"
dependencies = [
    "dash==4.4.0",
    "dash-ag-grid==35.3.0",
    "plotly==6.9.0",
    "geopandas==1.1.4",
    "fastapi==0.139.2",
    "uvicorn==0.51.0",
    "Flask==3.1.3",
    "Flask-Login==0.6.3",
    "Flask-Caching==2.4.1",
    "redis==8.0.1",
    "python-dotenv==1.2.2",
    "gunicorn==26.0.0",
    "psycopg[binary]==3.3.4",
    "pymongo==4.17.0",
    "pydantic==2.13.4",
    "email-validator==2.3.0",
    "pandas==3.0.3",
    "PyMuPDF==1.28.0",
    "Pillow==12.3.0",
    "kaleido==1.3.0",
    "reportlab==4.5.1",
    "boto3==1.43.51",
    "botocore==1.43.51",
    "bleach==6.4.0",
]

[project.optional-dependencies]
dev = [
    "bandit==1.9.4",
    "httpx==0.28.1",
    "pip-audit==2.10.0",
    "pyright==1.1.411",
    "pytest==9.1.1",
    "ruff==0.16.0",
    "vulture==2.16",
]

[project.scripts]
rainbowlens-dash = "app.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"app.dash" = ["assets/**/*.css", "assets/**/*.js", "assets/img/*"]
"app.edu" = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider", "-p", "no:dash"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["tmp"]

[tool.ruff.lint]
select = [
    "B",
    "BLE",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "FLY",
    "FURB",
    "I",
    "ISC",
    "PIE",
    "PLR0124",
    "PLR0402",
    "PYI",
    "RUF",
    "SIM",
    "TRY004",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
# These files intentionally contain mojibake sequences to repair and test imported data.
"src/app/analytics/statistics_exports.py" = ["RUF001"]
"tests/unit/analytics/test_statistics.py" = ["RUF001"]

[tool.ruff.format]
line-ending = "lf"
