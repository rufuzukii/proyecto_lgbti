services:
  - type: web
    name: proyecto-lgbti
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:server --bind 0.0.0.0:$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: LOCAL_MODE
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_SSL_MODE
        value: require
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        sync: false
      - key: CACHE_TYPE
        value: SimpleCache
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "3"
      - key: MONGO_SERVER_SELECTION_TIMEOUT_MS
        value: "2500"
      - key: ANALYTICS_CACHE_TIMEOUT_SECONDS
        value: "3600"
