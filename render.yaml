services:
  - type: web
    name: proyecto-lgbti
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:server --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-1} --threads ${GUNICORN_THREADS:-4} --timeout ${GUNICORN_TIMEOUT:-120} --access-logfile - --error-logfile -
    envVars:
      - key: APP_ENV
        value: production
      - key: LOCAL_MODE
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_SSL_MODE
        value: require
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        sync: false
      - key: CACHE_TYPE
        value: RedisCache
      - key: CACHE_VERSION
        value: v1
      - key: CACHE_DEFAULT_TIMEOUT
        value: "300"
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "3"
      - key: MONGO_SERVER_SELECTION_TIMEOUT_MS
        value: "2500"
      - key: ANALYTICS_CACHE_TIMEOUT_SECONDS
        value: "3600"
      - key: ANALYTICS_HEALTH_CHECK_TTL_SECONDS
        value: "15"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
      - key: GUNICORN_TIMEOUT
        value: "120"
