services:
  - type: web
    name: proyecto-lgbti
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:server --bind 0.0.0.0:$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: LOCAL_MODE
        value: "false"
      - key: SECRET_KEY
        generateValue: true
