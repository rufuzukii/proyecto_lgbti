services:
  - type: web
    name: proyecto-lgbti
    env: python
    buildCommand: pip install -e . -r requirements.txt
    startCommand: gunicorn wsgi:server --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-1} --threads ${GUNICORN_THREADS:-4} --timeout ${GUNICORN_TIMEOUT:-180} --access-logfile - --error-logfile -
    envVars:
      - key: APP_ENV
        value: production
      - key: LOCAL_MODE
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: 3.14.2
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_SSL_MODE
        value: require
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_SECRET_KEY
        sync: false
      - key: SUPABASE_S3_REGION
        value: us-east-1
      - key: SUPABASE_STORAGE_BUCKET
        value: felgtbi-reports
      - key: SUPABASE_CONNECT_TIMEOUT_SECONDS
        value: "3"
      - key: SUPABASE_READ_TIMEOUT_SECONDS
        value: "10"
      - key: CACHE_TYPE
        value: RedisCache
      - key: CACHE_VERSION
        value: v1
      - key: CACHE_DEFAULT_TIMEOUT
        value: "300"
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "3"
      - key: MONGO_SERVER_SELECTION_TIMEOUT_MS
        value: "2500"
      - key: ANALYTICS_CACHE_TIMEOUT_SECONDS
        value: "3600"
      - key: ANALYTICS_HEALTH_CHECK_TTL_SECONDS
        value: "15"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
      - key: GUNICORN_TIMEOUT
        value: "180"
      - key: UPLOAD_MAX_FILE_MB
        value: "20"
      - key: UPLOAD_MAX_TOTAL_MB
        value: "30"
      - key: UPLOAD_MAX_REQUEST_MB
        value: "90"
      - key: PDF_FIGURE_MAX_PIXELS
        value: "2500000"
