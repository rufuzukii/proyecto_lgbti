services:
  - type: web
    name: proyecto-lgbti
    runtime: python
    buildCommand: bash scripts/render_build.sh
    startCommand: bash scripts/render_start.sh
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOCAL_MODE
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: 3.14.2
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_LIFETIME_HOURS
        value: "12"
      - key: AUTH_MAX_ATTEMPTS
        value: "6"
      - key: AUTH_WINDOW_SECONDS
        value: "300"
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_SSL_MODE
        value: require
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_SECRET_KEY
        sync: false
      - key: SUPABASE_S3_REGION
        value: us-east-1
      - key: SUPABASE_STORAGE_BUCKET
        value: felgtbi-reports
      - key: DIDACTIC_SLIDES_BUCKET
        value: slideshow-didactics
      - key: DIDACTIC_SLIDES_BUCKET_PUBLIC
        value: "true"
      - key: SUPABASE_CONNECT_TIMEOUT_SECONDS
        value: "3"
      - key: SUPABASE_READ_TIMEOUT_SECONDS
        value: "10"
      - key: CACHE_VERSION
        value: v1
      - key: CACHE_DEFAULT_TIMEOUT
        value: "300"
      - key: LOCAL_CACHE_MAX_ENTRIES
        value: "512"
      - key: LOCAL_CACHE_MAX_VALUE_BYTES
        value: "4194304"
      - key: LOCAL_CACHE_MAX_TOTAL_BYTES
        value: "67108864"
      - key: RATE_LIMIT_LOCAL_MAX_KEYS
        value: "10000"
      - key: HTTP_GZIP_MIN_BYTES
        value: "1024"
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "3"
      - key: POSTGRES_POOL_MAX_SIZE
        value: "6"
      - key: POSTGRES_POOL_MAX_IDLE_SECONDS
        value: "60"
      - key: POSTGRES_POOL_WAIT_TIMEOUT_SECONDS
        value: "3"
      - key: MONGO_SERVER_SELECTION_TIMEOUT_MS
        value: "2500"
      - key: MONGO_MAX_POOL_SIZE
        value: "12"
      - key: MONGO_MAX_IDLE_TIME_MS
        value: "60000"
      - key: MONGO_WAIT_QUEUE_TIMEOUT_MS
        value: "2000"
      - key: MONGO_ENSURE_INDEXES_ON_STARTUP
        value: "false"
      - key: ANALYTICS_CACHE_TIMEOUT_SECONDS
        value: "3600"
      - key: ANALYTICS_HEALTH_CHECK_TTL_SECONDS
        value: "15"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
      - key: GUNICORN_TIMEOUT
        value: "180"
      - key: UPLOAD_MAX_FILE_MB
        value: "20"
      - key: UPLOAD_MAX_TOTAL_MB
        value: "30"
      - key: UPLOAD_MAX_REQUEST_MB
        value: "90"
      - key: UPLOAD_MAX_ATTEMPTS
        value: "10"
      - key: UPLOAD_WINDOW_SECONDS
        value: "3600"
      - key: PDF_FIGURE_MAX_PIXELS
        value: "2500000"
      - key: PDF_MAX_PAGES
        value: "500"
      - key: FELGTBI_SCRAPER_MAX_RESPONSE_MB
        value: "20"
      - key: REPORT_PREVIEW_MAX_ATTEMPTS
        value: "30"
      - key: REPORT_DOWNLOAD_MAX_ATTEMPTS
        value: "10"
      - key: REPORT_RATE_WINDOW_SECONDS
        value: "3600"
      - key: PRIVACY_CONTROLLER_NAME
        sync: false
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      - key: PRIVACY_POLICY_EFFECTIVE_DATE
        value: "2026-08-06"
      - key: PRIVACY_AUDIT_RETENTION_DAYS
        value: "90"
      - key: PRIVACY_DELETION_JOB_RETENTION_DAYS
        value: "30"
      - key: PRIVACY_DELETE_MAX_ATTEMPTS
        value: "5"
      - key: PRIVACY_DELETE_WINDOW_SECONDS
        value: "3600"
      - key: PRIVACY_EXPORT_MAX_ATTEMPTS
        value: "10"
      - key: PRIVACY_EXPORT_WINDOW_SECONDS
        value: "3600"
      - key: PRIVACY_BACKUP_RETENTION
        sync: false
      - key: PRIVACY_ACCESS_LOG_RETENTION
        sync: false
      - key: PRIVACY_HOSTING_LOCATION
        sync: false
      - key: PRIVACY_POSTGRES_PROVIDER
        sync: false
      - key: PRIVACY_MONGO_PROVIDER
        sync: false
      - key: PRIVACY_TRANSFER_SAFEGUARDS
        sync: false
